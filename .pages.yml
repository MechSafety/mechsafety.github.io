media:
  input: images/uploads
  output: /images/uploads
  rename: safe
  extensions: [png, jpg, jpeg, webp]

content:
  - name: website
    label: 홈페이지 관리
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: _data/cms/home.json
        format: json
        fields:
          - { name: eyebrow, label: 상단 분야명, type: string, required: true }
          - { name: title, label: 연구실 소개 문장, type: text, required: true }
          - { name: recruitment_title, label: 학생 모집 영문, type: string }
          - { name: recruitment_text, label: 학생 모집 국문, type: text }

      - name: news
        label: News
        type: collection
        path: _cms_news
        format: yaml-frontmatter
        filename: "{year}-{month}-{day}-{title}.md"
        view:
          fields: [title, date, category, published]
          primary: title
          sort: [date, title]
          search: [title, category, summary]
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: 제목
            type: string
            required: true
            description: 행사명이나 활동명을 적습니다. 날짜는 아래 날짜 항목에 입력합니다.
          - name: date
            label: 날짜
            type: date
            required: true
            description: 실제 활동 날짜를 입력합니다. News는 최신 날짜순으로, Home에는 최신 소식 3개가 표시됩니다.
          - name: category
            label: 분류
            type: select
            options: [교육, 학술대회, 세미나, 수상, 워크숍, 연구실 활동]
          - name: summary
            label: 목록 설명
            type: text
            required: true
            description: 활동 내용을 한 문장으로 적습니다. 참석자를 단순히 소개할 때는 ‘연구실 구성원들이’로 통일합니다.
          - name: body
            label: 본문
            type: rich-text
            description: 날짜, 장소와 활동의 핵심을 1~2문장으로 적습니다. 사진은 본문에 끼워 넣지 않고 아래 사진 항목에 추가합니다.
            options:
              format: markdown
              switcher: false
              media: false
          - name: images
            label: 사진
            type: image
            description: 개수 제한 없이 표시할 순서대로 추가합니다. 첫 사진이 News와 Home의 대표 사진입니다. 홈페이지에서는 원본 비율을 유지하고 긴 변을 기준으로 크기가 자동 조정됩니다.
            options:
              multiple: true
          - name: published
            label: 홈페이지 공개
            type: boolean
            required: true
            description: 켜고 Save를 누르면 정식 홈페이지 배포가 시작됩니다. 몇 분 뒤 홈페이지에서 실제 글과 사진을 확인합니다.

      - name: members
        label: Members
        type: collection
        path: _cms_members
        format: yaml-frontmatter
        filename: "{name}.md"
        view:
          fields: [name, group, order, published]
          primary: name
          sort: [order, group, name]
          search: [name, group, research]
          default:
            sort: order
            order: asc
        fields:
          - { name: name, label: 이름, type: string, required: true }
          - name: group
            label: 구분
            type: select
            options: [Principal Investigator, Postdoctoral Researcher, Ph.D. Student, M.S. Student, Undergraduate Researcher, Alumni]
          - { name: degree, label: 학위, type: string }
          - { name: research, label: 연구분야, type: text }
          - { name: email, label: 이메일, type: string }
          - { name: photo, label: 사진, type: image }
          - { name: order, label: 표시 순서, type: number, required: true }
          - { name: published, label: 홈페이지 공개, type: boolean, required: true }

      - name: research
        label: Research
        type: collection
        path: _cms_research
        format: yaml-frontmatter
        filename: "{title}.md"
        view:
          fields: [title, order, published]
          primary: title
          sort: [order, title]
          search: [title, summary]
          default:
            sort: order
            order: asc
        fields:
          - { name: title, label: 연구 분야명, type: string, required: true }
          - { name: summary, label: 설명, type: text, required: true }
          - name: images
            label: 대표 이미지
            type: image
            options:
              multiple:
                max: 3
          - { name: order, label: 표시 순서, type: number, required: true }
          - { name: published, label: 홈페이지 공개, type: boolean, required: true }

      - name: publications
        label: Publications
        type: collection
        path: _cms_publications
        format: yaml-frontmatter
        filename: "{year}-{title}.md"
        exclude: [.gitkeep]
        view:
          fields: [title, year, publication_group, published]
          primary: title
          sort: [year, title]
          search: [title, authors, venue]
          default:
            sort: year
            order: desc
        fields:
          - { name: year, label: 연도, type: number, required: true }
          - name: publication_group
            label: 논문 구분
            type: select
            options: [SCIE, 국내 논문]
            required: true
          - { name: title, label: 논문 제목, type: string, required: true }
          - { name: authors, label: 저자, type: string, required: true }
          - { name: venue, label: 학술지 또는 학술대회, type: string }
          - name: publication_type
            label: 구분
            type: select
            options: [Journal, Conference, Patent, Other]
          - { name: link, label: 논문 링크, type: string }
          - { name: published, label: 홈페이지 공개, type: boolean, required: true }

      - name: projects
        label: Projects
        type: collection
        path: _cms_projects
        format: yaml-frontmatter
        filename: "{start_date}-{title}.md"
        view:
          fields: [title, agency, start_date, end_date, role, published]
          primary: title
          sort: [start_date, end_date, title]
          search: [title, agency]
          default:
            sort: start_date
            order: desc
        fields:
          - { name: title, label: 과제명, type: string, required: true }
          - { name: agency, label: 발주 또는 지원기관, type: string }
          - { name: start_date, label: 시작일, type: date, required: true }
          - { name: end_date, label: 종료일, type: date, required: true }
          - name: role
            label: 역할
            type: select
            options: [연구책임자, 공동연구책임자, 공동연구원, 참여연구원]
          - { name: image, label: 대표 이미지, type: image }
          - { name: published, label: 홈페이지 공개, type: boolean, required: true }

      - name: courses
        label: Courses
        type: collection
        path: _cms_courses
        format: yaml-frontmatter
        filename: "{title}.md"
        view:
          fields: [title, order, published]
          primary: title
          sort: [order, title]
          search: [title, title_en]
          default:
            sort: order
            order: asc
        fields:
          - { name: title, label: 과목명, type: string, required: true }
          - { name: title_en, label: 과목명 영문, type: string, required: true }
          - name: offerings
            label: 개설 이력
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{year}년 {semester}"
            fields:
              - { name: year, label: 연도, type: number, required: true }
              - name: semester
                label: 학기
                type: select
                options: [1학기, 2학기, 하계학기, 동계학기]
          - name: images
            label: 교과목 사진
            type: image
            options:
              multiple:
                max: 2
          - { name: order, label: 표시 순서, type: number, required: true }
          - { name: published, label: 홈페이지 공개, type: boolean, required: true }

      - name: contact
        label: Contact
        type: file
        path: _data/cms/contact.json
        format: json
        fields:
          - { name: affiliation, label: 소속, type: string, required: true }
          - { name: address, label: 주소, type: text, required: true }
          - { name: email, label: 이메일, type: string, required: true }
          - { name: website, label: 홈페이지 주소, type: string, required: true }
          - { name: map_url, label: 카카오맵 주소, type: string, required: true }

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Add {name} via Pages CMS"
      update: "Update {name} via Pages CMS"
      delete: "Remove {name} via Pages CMS"
