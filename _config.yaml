# site properties and page defaults
title: MSCS Lab
lab_name: Mechanical Safety and Computational Simulation Laboratory
lab_name_ko: 기계안전 및 전산시뮬레이션 연구실
subtitle: 충북대학교 안전공학과
description: MSCS Lab, 기계안전 및 전산시뮬레이션 연구실, 충북대학교 안전공학과. Our research aims to understand physical phenomena and address engineering problems.
url: https://mechsafety.github.io
baseurl: ""
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  github: MechSafety

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  - scope:
      type: "cms_news"
    values:
      layout: modern-news

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  cms_news:
    output: true
    permalink: /news/:name/
  cms_members:
    output: false
  cms_research:
    output: false
  cms_projects:
    output: false
  cms_publications:
    output: false
  cms_courses:
    output: false

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  - .design-preview

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - tmp

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
