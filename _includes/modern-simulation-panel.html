{% assign media = site.data.cms.simulation_media %}
<div class="simulation-showcase" aria-label="Representative numerical simulations">
  <div class="simulation-grid">
    {% for item in media.items %}
    <figure class="simulation-tile">
      <button class="simulation-open" type="button" data-simulation="{{ forloop.index0 }}" aria-label="{{ item.title }} 영상 확대">
        <video muted loop playsinline preload="none" poster="{{ item.poster | relative_url }}" data-src="{{ item.video | relative_url }}" aria-label="{{ item.title }}">
          <img src="{{ item.poster | relative_url }}" alt="{{ item.title }} 해석 결과">
        </video>
        <span class="simulation-expand" aria-hidden="true">↗</span>
      </button>
      <figcaption><span>{{ item.title }}</span></figcaption>
    </figure>
    {% endfor %}
  </div>
</div>
<dialog class="simulation-dialog" id="simulation-dialog" aria-labelledby="simulation-dialog-title">
  <div class="simulation-dialog-header"><h2 id="simulation-dialog-title"></h2><button type="button" id="simulation-dialog-close">닫기 ×</button></div>
  <video id="simulation-dialog-video" controls muted playsinline preload="none"></video>
  <p id="simulation-dialog-note" lang="ko"></p>
</dialog>
<script type="application/json" id="simulation-media-data">{{ media.items | jsonify }}</script>
<script src="{{ '/assets/js/home-simulations.js' | relative_url }}?v=20261102-clean" defer></script>
