{% assign navigation_version = site.time | date: '%s' %}
<header class="site-header">
  <div class="nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}?v={{ navigation_version }}" title="{{ site.lab_name | escape }}"><span>{{ site.title }}</span></a>
    <nav class="site-nav" lang="en" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'home' %} aria-current="page"{% endif %}>Home</a>
      <div class="nav-item">
        <a href="{{ '/members/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'members' %} aria-current="page"{% endif %}>Members</a>
        <div class="subnav">
          <a href="{{ '/members/' | relative_url }}?v={{ navigation_version }}#current-members">Current Members</a>
          <a href="{{ '/members/' | relative_url }}?v={{ navigation_version }}#alumni">Alumni</a>
        </div>
      </div>
      <a href="{{ '/research/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <div class="nav-item">
        <a href="{{ '/publications/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'publications' %} aria-current="page"{% endif %}>Publications</a>
        <div class="subnav">
          <a href="{{ '/publications/' | relative_url }}?v={{ navigation_version }}#scie-publications">SCIE</a>
          <a href="{{ '/publications/' | relative_url }}?v={{ navigation_version }}#domestic-publications">Domestic Publications</a>
        </div>
      </div>
      <a href="{{ '/news/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'news' %} aria-current="page"{% endif %}>News</a>
      <a href="{{ '/courses/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'courses' %} aria-current="page"{% endif %}>Courses</a>
      <a href="{{ '/contact/' | relative_url }}?v={{ navigation_version }}"{% if page.section == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
