name: on-schedule
run-name: on schedule

on:
  # Legacy citation importer is manual-only; publications are managed in Pages CMS.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # only run on user instance of template, not template itself
    if: github.repository != 'greenelab/lab-website-template'
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit
    with:
      open-pr: true
